name: zhixu-teaching
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: teaching
      POSTGRES_USER: teaching
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/setup.ps1 first}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U teaching -d teaching']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: ./backend
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      DATABASE_URL: postgres://teaching:${DB_PASSWORD}@db:5432/teaching?sslmode=disable
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run scripts/setup.ps1 first}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: 'false'
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, /app/server, healthcheck]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  database:
  uploads:
