schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Stack: React + TypeScript, Go HTTP API, MySQL 8.4 (FULLTEXT ngram), Qdrant, Docker Compose.
  Deployment target: local Docker Desktop, localhost:8080.
  UI: white primary surfaces, red accents, responsive Chinese interface.
  Embeddings and chat are called from the server side only, through a course gateway
  compatible with the OpenAI API; keys never reach the browser.
  Implemented scope: authentication (password sessions), classrooms, private handout uploads,
  class-scoped knowledge ingestion with configurable chunking and seed material import,
  three retrieval modes (keyword/vector/hybrid) and one-shot answers with server-generated
  citations. Archived changes live under openspec/changes/archive.
  In flight (lesson 5: planning complete, implementation not started): solver-assistant
  (teacher prompts plus a guidance-only skill, student chat sessions with SSE streaming and
  citations, opaque Bearer tokens reusing the session table), openapi-swagger (OpenAPI 3.1
  contract served with a self-hosted Swagger UI and a drift check), api-test-suite
  (apitest/ with one script per endpoint, run_all.py and an HTML report, database-level
  assertions).

