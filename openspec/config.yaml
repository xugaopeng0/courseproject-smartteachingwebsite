schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Stack: React + TypeScript, Go HTTP API, MySQL 8.4 (FULLTEXT ngram), Qdrant, Docker Compose.
  Deployment target: local Docker Desktop, localhost:8080.
  UI: white primary surfaces, red accents, responsive Chinese interface.
  Embeddings and chat are called from the server side only, through a course gateway
  compatible with the OpenAI API; keys never reach the browser.
  Implemented scope: authentication, classrooms, private handout uploads, class-scoped
  knowledge ingestion with configurable chunking and seed material import.
  In flight: three retrieval modes (knowledge-retrieval-modes) and answer generation
  with citations (knowledge-answer-citations).

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
